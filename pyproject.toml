[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "renfield-mcp-weather"
version = "1.1.0"
description = "MCP server for Open-Meteo weather API with location-based tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Renfield Project" }
]
keywords = ["mcp", "weather", "open-meteo", "forecast", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",  # Mock httpx requests
    "ruff>=0.3.0",
]

[project.scripts]
renfield-mcp-weather = "renfield_mcp_weather:main"

[tool.hatch.build.targets.wheel]
packages = ["src/renfield_mcp_weather"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

# Include locale JSON files in the package
[tool.hatch.build.targets.sdist]
include = [
    "src/renfield_mcp_weather/**/*.json",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
